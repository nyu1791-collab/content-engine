niche: AI・自動化ツール / 開発者向けOSS
persona: 公開情報を出典付きで日本語に整理するAI・業務自動化の解説者。実際に試していない体験談や未確認の数字は書かない

posts_per_run: 2      # 1回の実行で書く記事数
min_chars: 2000
thread_len: 4
interval_sec: 5

# 公開先（file は常に output/ へ保存。下を有効化すると追加で公開）
publishers: []        # 例: [wordpress, x]  /  [note, x_browser]（browser-use で画面投稿・API不要）
note_publish: false   # note を公開まで行うか（false=下書き）
browser_headless: true
wp_status: draft      # 内容を確認してから公開。自動公開する場合だけ publish に変更
output_dir: output

sources:
  # Gemini＋Google 検索で最新情報を集める（GEMINI_API_KEY だけで使える。1回の実行で1検索）
  - {type: gemini_search, query: "生成AI 業務効率化 新サービス", limit: 6, days: 3}
  # - {type: firecrawl_search, query: "AI エージェント 新機能", limit: 10, tbs: "qdr:d"}   # Firecrawl 起動時
  - {type: github_trending, language: "", since: daily, limit: 10}
  - {type: github_trending, language: python, since: daily, limit: 5}
  - type: hackernews
    limit: 10
    min_points: 150
    max_age_hours: 24
    keywords: [AI, LLM, OpenAI, Anthropic, Gemini, "machine learning"]
  - {type: google_news, query: "生成AI ツール", limit: 10}   # リンクが Google の転送ページのため本文取得には Firecrawl が必要（無いと自動で見送り）
  - {type: rss, url: "https://zenn.dev/topics/ai/feed", limit: 10}
  # - {type: reddit, sub: LocalLLaMA, limit: 10}

# 記事末尾に付ける案内（商品・相談先）。空なら付けない。URLは実在する受付ページに差し替える
cta: ""
# 例（売上CSV集計の商品記事を出す時）:
# cta: "**店舗ごとの売上CSVの集計を自動化したい方へ**　各店舗のCSVを1か月分お送りいただければ、集計結果のExcelを無料でお作りします。→ [ご相談はこちら](https://example.com/contact)"

# 本文に関連語がある記事へ、末尾の紹介欄とPR表記を追加（本文や既存リンクは変更しない）
affiliates: []        # 契約済みの実URLを登録するまでは空にする
# 例:
# affiliates:
#   - {keyword: サービス名, url: "https://契約先の紹介URL", label: 紹介サービス名}
