# vendor/firecrawl/docker-compose.yaml（Firecrawl 本体・無改変）に重ねる設定
# - ビルド不要: 公式ビルド済みイメージを使う（失敗時はソースからビルドにフォールバック）
# - 16GB ノート向けにメモリ上限を調整
# - Firecrawl 内部の LLM 機能（extract / json 形式）に Gemini の OpenAI互換エンドポイントを使う
services:
  api:
    image: ghcr.io/firecrawl/firecrawl:latest
    cpus: 2.0
    mem_limit: 4G
    memswap_limit: 4G
    environment:
      OPENAI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai/
      MODEL_NAME: ${GEMINI_MODEL:-gemini-2.5-flash}
      USE_DB_AUTHENTICATION: "false"
  playwright-service:
    image: ghcr.io/firecrawl/playwright-service:latest
    cpus: 1.5
    mem_limit: 2G
    memswap_limit: 2G
  nuq-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
