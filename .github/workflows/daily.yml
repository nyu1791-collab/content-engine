name: daily-content
on:
  schedule:
    - cron: "17 22 * * *"   # 毎日 07:17 JST
  workflow_dispatch:
    inputs:
      n: {description: "記事数", default: "2"}
permissions:
  contents: write
concurrency:
  group: daily-content-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m engine run -n "$ARTICLE_COUNT"
        env:
          ARTICLE_COUNT: ${{ github.event.inputs.n || '2' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      - name: preserve state & articles
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: content-state-${{ github.run_id }}
          path: |
            data/state.json
            output/
          if-no-files-found: ignore
          retention-days: 7
      - name: commit state & articles
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          STATE_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f data/state.json ]; then git add data/state.json; fi
          if [ -d output ]; then git add output/; fi
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "content: $(date +%F)"
          git push origin "HEAD:$STATE_BRANCH"
