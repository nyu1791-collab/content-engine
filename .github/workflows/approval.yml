name: approval-and-video-jobs

# 10分ごとにDiscordの承認返信を読む。承認された記事は公開し、承認された動画テーマは voiceBox-Pipeline へ渡す。
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: content-state-${{ github.ref }}   # daily.yml と同じ。state.json の書き込みを一度に1つにする
  cancel-in-progress: false
jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Read Discord approvals
        run: python -m engine approve
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_APPROVAL_CHANNEL_ID: ${{ secrets.DISCORD_APPROVAL_CHANNEL_ID }}
          DISCORD_APPROVER_ID: ${{ secrets.DISCORD_APPROVER_ID }}
          VIDEO_JOB_DIR: data/video_jobs
      - name: Hand approved video topics to voiceBox-Pipeline
        run: python scripts/dispatch_video_jobs.py
        env:
          VIDEO_JOB_DIR: data/video_jobs
          VOICEBOX_REPO: nyu1791-collab/voiceBox-Pipeline
          VOICEBOX_DISPATCH_TOKEN: ${{ secrets.VOICEBOX_DISPATCH_TOKEN }}
      - name: Save approval state
        env:
          STATE_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f data/state.json ]; then git add data/state.json; fi
          if [ -d data/video_jobs ]; then git add data/video_jobs; fi
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "approval: $(date +%F-%H%M)"
          git push origin "HEAD:$STATE_BRANCH"
